name: Build Fractal Factory Windows x64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Resolume FFGL SDK
        shell: powershell
        run: git clone --depth 1 https://github.com/resolume/ffgl.git external/ffgl

      - name: Install GLEW with vcpkg
        shell: powershell
        run: vcpkg install glew:x64-windows

      - name: Configure x64
        shell: powershell
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Release
        shell: powershell
        run: cmake --build build --config Release --parallel

      - name: Collect binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item build/Release/FractalFactory.dll artifacts/FractalFactory.dll
          Copy-Item build/Release/FractalFactoryControl.exe artifacts/FractalFactoryControl.exe

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/FractalFactory.iss
          Copy-Item installer/output/FractalFactory_Setup_x64.exe artifacts/FractalFactory_Setup_x64.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FractalFactory-Windows-x64
          path: artifacts/*
          if-no-files-found: error
